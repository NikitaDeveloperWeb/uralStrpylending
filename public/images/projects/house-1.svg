  <rect x="350" y="320" width="100" height="130" fill="none" stroke="#b18e72" stroke-width="1" opacity="0.4"/>
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="28" fill="#b18e72" text-anchor="middle" font-weight="300" letter-spacing="4">{title}</text>
