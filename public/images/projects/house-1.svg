<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1713;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#221f1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <line x1="400" y1="100" x2="400" y2="200" stroke="#b18e72" stroke-width="1"/>
